<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Voxel UI 原型 · 左看右控壳层 · 金属框羊皮纸</title>
</head>
<body>
<style>
/* ============================================================
   Voxel UI 原型 —— 核心心智模型（建造模式重构版）：
   ① 左看右控：左上=产业锚(我是谁) · 左下=选中详情横板(我在看什么)
                右上=环境组(怎么看世界) · 建造态左列=工具配置(纯参数)
   ② 建造三组件：底带=历史│工具(动作) · 库行=对象(跟随工具开合) · 左列=参数
      三元组：操作 = 工具(怎么改) × 库对象(用什么) × 配置(具体参数)
   ③ 确认/取消在世界内：EDITING 时选区旁 ✓✕ 浮标（Enter/RMB），底带无执行组
   ④ 建造态隐藏左轨玩家域；时间暂停；预算条在左上操作槽（固定高度零跳动）
   ⑤ 模式只决定"能点什么/能干什么"，不决定"展示什么"
   ⑥ 事项（任务/委托/警告）= 产业面板顶部小按钮，点击弹窗，不占固定位
   ⑦ 环境组（右上）= 小地图(场景切换) + 视图控制(视角/渲染层/剖切框) + 时间倍速
   视觉：金属框 + 羊皮纸底（暗调做旧），模式强调色微区分
   ============================================================ */
.v6 { --bg:#15100a;
      --gold:#d9a95c; --gold2:#8a6a3a; --line:#4a3a20; --lineH:#6b4d26;
      --txt:#efe0bd; --mut:#b3a07c; --faint:#7d6f52;
      --ok:#96b46a; --warn:#d99a4e; --bad:#cf6a52; --info:#8aa8c8;
      --serif:'Georgia','Noto Serif SC','STZhongsong','SimSun',serif;
      font-family:'Segoe UI',system-ui,sans-serif; color:var(--txt); font-size:12px; }
/* 模式强调色：经营暖金 / 建造铜赭 / 探索苔绿 / 遭遇绛红 */
.v6-screen { --ac:#d9a95c; --ac2:#8a6a3a; }
.v6-screen[data-mode="build"] { --ac:#c8834a; --ac2:#7a4a26; }
.v6-screen[data-mode="explore"] { --ac:#8fae62; --ac2:#55663a; }
.v6-screen[data-combat="1"] { --ac:#c86456; --ac2:#6a3428; }
.v6 * { box-sizing:border-box; margin:0; }
.v6-screen { position:relative; width:1280px; height:700px; overflow:hidden; border-radius:10px; border:1px solid #3a2c1c;
  background:
    radial-gradient(1100px 480px at 30% 18%, rgba(140,100,50,.10), transparent 60%),
    radial-gradient(800px 460px at 75% 72%, rgba(90,120,70,.08), transparent 60%),
    var(--bg); }
.v6-vp { position:absolute; inset:0; z-index:1; overflow:hidden; }
.v6-vpmark { position:absolute; color:#93805f; font-size:11px; user-select:none; }
.v6-vpmark[data-sel-char], .v6-vpmark[data-sel-area], .v6-vpmark[data-foe] { cursor:pointer; }
.v6-vpmark:hover[data-sel-char], .v6-vpmark:hover[data-sel-area] { color:var(--gold); }

/* ---------- 通用件：羊皮纸卡（四角铆钉 + 金属双线 + 纸纹 + 晕影） ---------- */
.v6-card {
  background:
    radial-gradient(circle 3px at 10px 10px, #e3c98f 0 35%, #8a6a3a 62%, transparent 72%),
    radial-gradient(circle 3px at calc(100% - 10px) 10px, #e3c98f 0 35%, #8a6a3a 62%, transparent 72%),
    radial-gradient(circle 3px at 10px calc(100% - 10px), #e3c98f 0 35%, #8a6a3a 62%, transparent 72%),
    radial-gradient(circle 3px at calc(100% - 10px) calc(100% - 10px), #e3c98f 0 35%, #8a6a3a 62%, transparent 72%),
    repeating-linear-gradient(112deg, rgba(170,130,70,.05) 0 2px, transparent 2px 6px),
    linear-gradient(160deg, #2e2413, #221a0e);
  border:1px solid #49351c; border-radius:9px;
  box-shadow: 0 0 0 1px #120c06, inset 0 0 0 1px rgba(214,176,106,.25),
    inset 0 0 16px rgba(15,9,2,.55), inset 0 1px 0 rgba(233,200,130,.18), 0 4px 14px rgba(0,0,0,.45); }
.v6-sec { font:700 9px var(--serif); letter-spacing:2px; color:var(--gold2); margin:9px 0 4px; display:flex; align-items:center; gap:6px; }
.v6-sec::after { content:''; flex:1; height:2px;
  background:linear-gradient(90deg, transparent, #6b4d26 18%, #c9a25e 50%, #6b4d26 82%, transparent); }
.v6-row { display:flex; align-items:center; gap:8px; margin:3px 0; flex-wrap:wrap; }
.v6-row .lb { color:var(--mut); font-size:11px; }
.v6-row .v { margin-left:auto; font-weight:600; font-size:11px; }
.v6-row .v.gd { color:var(--ok); } .v6-row .v.bad { color:var(--bad); }
.v6-btn { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border-radius:7px;
          background:linear-gradient(180deg,#332716,#241b0e); border:1px solid var(--lineH);
          box-shadow:0 0 0 1px #120c06, inset 0 1px 0 rgba(233,200,130,.12);
          font-size:11px; cursor:pointer; color:var(--txt); white-space:nowrap; }
.v6-btn:hover { border-color:var(--gold); color:#ffe8c0; }
.v6-btn.gold { background:linear-gradient(180deg,#8a5f2a,#5f4020); border:1px solid var(--gold);
               box-shadow:0 0 0 1px #120c06, inset 0 1px 0 rgba(255,230,180,.25); color:#ffe8c0; font-weight:600; }
.v6-btn.gold:hover { filter:brightness(1.12); }
.v6-btn.warn { border-color:#7a4a2a; color:var(--warn); }
.v6-btn.dis { opacity:.4; cursor:not-allowed; }
.v6-btn .kbd { font-size:8px; color:var(--mut); border:1px solid var(--line); border-radius:3px; padding:0 3px; }
.v6-btn.gold .kbd { color:#ffe0b0; border-color:var(--gold2); }
.v6-tag { font-size:10px; padding:1px 8px; border-radius:3px; background:#241b0e; color:var(--mut); border:1px solid var(--line); }
.v6-none { color:var(--faint); font-size:11px; }
.v6-inp { background:#1a130c; border:1px solid var(--line); border-radius:4px; color:var(--txt); padding:3px 8px; font-size:11px; width:56px; }
.v6-opt { display:inline-block; padding:4px 10px; border-radius:5px; background:#2c2113; border:1px solid var(--line);
          font-size:11px; cursor:pointer; margin:2px 3px 2px 0; box-shadow:0 0 0 1px #120c06; }
.v6-opt.on { background:#5c4020; border-color:var(--gold); color:#ffe8c0; }
.v6-group { background:rgba(20,14,7,.55); border:1px solid var(--line); border-radius:7px; padding:8px 10px;
            box-shadow:inset 0 0 10px rgba(15,9,2,.4); }
.v6-gt { font-size:10px; color:var(--gold2); margin-bottom:5px; letter-spacing:.5px; }
.v6-lrow { display:flex; gap:8px; align-items:center; padding:6px 8px; border-bottom:1px solid rgba(74,56,38,.4); font-size:11px; }
.v6-lrow:last-child { border-bottom:none; }
.v6-lrow:hover { background:rgba(138,95,42,.12); }

/* ---------- 右上环境组：小地图 + 日历天气 + 时间倍速 + 系统（无顶栏） ---------- */
.v6-envcard { display:flex; flex-direction:column; align-items:center; padding:8px 9px 7px; position:relative; }
.v6-envrow { display:flex; align-items:center; gap:8px; justify-content:center; font-size:10px; color:var(--mut); white-space:nowrap; }
.v6-envrow .tm { font:700 15px var(--serif); color:#ffe8c0; font-variant-numeric:tabular-nums; text-shadow:0 1px 2px #000; }
.v6-envrow .ic { font-size:13px; }
.v6-cal { cursor:pointer; padding:2px 8px; border-radius:5px; border:1px solid transparent; }
.v6-cal:hover { border-color:var(--gold); color:#ffe8c0; }
.v6-envline { width:82%; height:1px; margin-top:6px; background:linear-gradient(90deg,transparent,#4a3a20,transparent); }
.v6-clock { display:flex; align-items:center; gap:5px; white-space:nowrap; }
.v6-clock .st { font-size:9px; color:var(--mut); }
.v6-clock[data-envpop] { cursor:pointer; }
.v6-clock[data-envpop]:hover { color:var(--gold); }
.minis .minis-link { cursor:pointer; }
.minis .minis-link:hover { color:var(--gold); }
.v6-spd { display:flex; border:1px solid var(--line); border-radius:5px; overflow:hidden; box-shadow:0 0 0 1px #120c06; }
.v6-spd span { padding:2px 7px; font-size:10px; cursor:pointer; color:var(--mut); background:rgba(20,15,9,.6); border-right:1px solid var(--line); }
.v6-spd span:last-child { border-right:none; }
.v6-spd span.on { background:#5c4020; color:#ffe8c0; font-weight:600; }
.v6-spd span.dis { opacity:.35; cursor:not-allowed; }
.v6-sysbtn { height:22px; padding:0 9px; border-radius:5px; background:#2c2113; border:1px solid var(--lineH);
             box-shadow:0 0 0 1px #120c06; display:inline-flex; align-items:center; gap:4px; font-size:10px; cursor:pointer; white-space:nowrap; }
.v6-sysbtn:hover { border-color:var(--gold); }
.v6-sysbtn .kbd { font-size:8px; color:var(--mut); }
.v6-sysmenu { position:absolute; top:200px; right:10px; z-index:35; min-width:170px; background:var(--panel,#241b0e);
              border:1px solid var(--lineH); border-radius:8px; padding:5px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.6); }
.v6-sysmenu.on { display:block; }
.v6-sysmenu .mi { padding:7px 10px; border-radius:5px; font-size:12px; cursor:pointer; display:flex; justify-content:space-between; gap:14px; }
.v6-sysmenu .mi:hover { background:#3e2f1c; }
.v6-sysmenu .mi .kbd { color:var(--mut); font-size:10px; }

/* ---------- 左轨：玩家域（恒定） ---------- */
.v6-side { position:absolute; left:10px; top:330px; bottom:60px; width:48px; z-index:8; display:flex; flex-direction:column; gap:6px;
           align-items:center; padding-top:6px; }
.v6-rbtn { width:38px; height:38px; border-radius:9px;
           background:radial-gradient(circle at 36% 30%, #3a2c18, #201809 80%);
           border:1px solid var(--lineH); box-shadow:0 0 0 1px #120c06, inset 0 1px 0 rgba(233,200,130,.14);
           display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }
.v6-rbtn:hover { border-color:var(--gold); box-shadow:0 0 0 1px #120c06, 0 0 8px rgba(217,169,92,.25); }
.v6-rsep { width:22px; height:2px; background:linear-gradient(90deg,transparent,#6b4d26,transparent); margin:2px 0; }
.v6 .tt-rt[data-tt]:hover::after { bottom:auto; top:50%; transform:translateY(-50%); left:calc(100% + 8px); }

/* ---------- 左上：产业锚 + 业务事项（三模式恒位） ---------- */
.v6-ck { position:absolute; left:10px; top:8px; z-index:8; display:flex; flex-direction:column; gap:6px; }
.v6-ck-top { display:flex; gap:8px; align-items:flex-start; }
.v6-ck-l { display:flex; flex-direction:column; align-items:center; gap:6px; flex:none; width:96px; position:relative; }
.v6-crestw { position:relative; display:inline-flex; }
.v6-locbtn { position:absolute; right:-9px; top:-8px; width:20px; height:20px; border-radius:50%;
             background:#241b0e; border:1px solid var(--lineH); display:flex; align-items:center; justify-content:center;
             font-size:10px; cursor:pointer; z-index:2; }
.v6-locbtn:hover { border-color:var(--gold); color:var(--gold); }
/* 纹章：金属圆盘 + 红褐缎带等级 */
.v6-crest { width:56px; height:56px; border-radius:50%; position:relative;
            background:radial-gradient(circle at 38% 32%, #5a4020, #241a0e 75%);
            border:2px solid #c9a25e;
            box-shadow:0 0 0 2px #14100b, 0 0 0 3px #55402a, inset 0 0 10px rgba(0,0,0,.65), 0 4px 14px rgba(0,0,0,.5);
            display:flex; align-items:center; justify-content:center; font-size:25px; }
.v6-crest .lv { position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
                background:linear-gradient(180deg,#8a3a2a,#6a2a1e); border:1px solid #c9a25e;
                border-radius:4px; padding:0 6px; font:700 9px var(--serif); color:#ffdca8; white-space:nowrap;
                box-shadow:0 1px 4px rgba(0,0,0,.6); }
/* 进入/退出建造：缎带主按钮（原位翻转，唯一入口） */
.v6-buildbtn { padding:5px 8px; border-radius:7px; white-space:nowrap; background:linear-gradient(180deg,#8a5f2a,#5f4020); border:1px solid var(--gold);
               box-shadow:0 0 0 1px #120c06, inset 0 1px 0 rgba(255,230,180,.25);
               color:#ffe8c0; font:700 10px var(--serif); letter-spacing:1px; cursor:pointer; white-space:nowrap; }
.v6-buildbtn:hover { filter:brightness(1.15); }
.v6-buildbtn.exit { background:linear-gradient(180deg,#5a2e1c,#3e2012); border-color:var(--ac); color:#f0b8a0; }
.v6-buildbtn .kbd { font:400 8px sans-serif; opacity:.7; }
.v6-ck-r { flex:none; width:280px; display:flex; flex-direction:column; gap:5px; min-width:0; }
/* 次面板：细条摘要，点击切主域 */
.v6-psub { display:flex; align-items:center; gap:7px; padding:4px 10px; border-radius:8px; cursor:pointer;
           background:rgba(24,18,11,.82); border:1px solid var(--line); box-shadow:0 0 0 1px #120c06;
           font-size:10px; color:var(--mut); white-space:nowrap; }
.v6-psub:hover { border-color:var(--gold); }
.v6-psub .v { color:#ffe8c0; font-weight:600; font-variant-numeric:tabular-nums; }
.v6-psub .up { color:var(--ok); font-size:9px; }
.v6-psub .sw { margin-left:auto; color:var(--faint); font-size:11px; }
.v6-psub:hover .sw { color:var(--gold); }
/* 主面板：选中区域完整上下文（面包屑内聚于此） */
.v6-pmain { padding:8px 12px 9px; border-radius:10px;
            background:
              radial-gradient(circle 3px at 9px 9px, #e3c98f 0 35%, #8a6a3a 62%, transparent 72%),
              radial-gradient(circle 3px at calc(100% - 9px) 9px, #e3c98f 0 35%, #8a6a3a 62%, transparent 72%),
              radial-gradient(circle 3px at 9px calc(100% - 9px), #e3c98f 0 35%, #8a6a3a 62%, transparent 72%),
              radial-gradient(circle 3px at calc(100% - 9px) calc(100% - 9px), #e3c98f 0 35%, #8a6a3a 62%, transparent 72%),
              repeating-linear-gradient(112deg, rgba(170,130,70,.05) 0 2px, transparent 2px 6px),
              linear-gradient(160deg, #2c2312, #20180c);
            border:1px solid var(--lineH);
            box-shadow:0 0 0 1px #120c06, inset 0 0 0 1px rgba(214,176,106,.25), inset 0 0 14px rgba(15,9,2,.5), 0 6px 20px rgba(0,0,0,.45); }
/* 面包屑 = 选中区域的选择路径（右槽区域卡内，点上钻换选中） */
.v6-bc { display:flex; align-items:center; gap:3px; font-size:10px; color:var(--faint); margin-bottom:3px; flex-wrap:wrap; }
.v6-bc .seg { cursor:pointer; color:var(--info); padding:0 2px; }
.v6-bc .seg:hover { color:var(--gold); text-decoration:underline; }
.v6-bc .cur { color:var(--gold); font-weight:700; font-family:var(--serif); letter-spacing:1px; }
.v6-bc .sep { color:var(--faint); opacity:.6; }
/* 名称：钉在纹章（LOGO）正上方，只占 LOGO 宽度，不挤占面板上方空间 */
.v6-ckname { min-height:22px; padding:0 2px; white-space:nowrap; align-self:flex-start;
             font:700 14px var(--serif); color:#ffe8c0; letter-spacing:1px; text-shadow:0 1px 2px #000; }
/* 类型 + 营业灯：主面板资金行右侧 */
.v6-bigmeta { margin-left:auto; font-size:9px; color:var(--mut); align-self:center; }
.v6-big .lamp { font-size:10px; cursor:pointer; padding:2px 7px; border-radius:5px; border:1px solid transparent; align-self:center; }
.v6-big .lamp.on { color:var(--ok); } .v6-big .lamp.off { color:var(--bad); }
.v6-big .lamp:hover { border-color:currentColor; }
/* 营业开关：明确的按钮，不是小字标签 */
.v6-lampbtn { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 10px; border-radius:11px;
              font-size:10px; line-height:1; cursor:pointer; border:1px solid; white-space:nowrap; align-self:center; }
.v6-lampbtn.on  { background:linear-gradient(180deg,#3f5a2a,#2a3d1c); border-color:#7fae4e; color:#d8f0b8; }
.v6-lampbtn.off { background:linear-gradient(180deg,#5a2e2c,#3a1c1a); border-color:#a05446; color:#f0c0b8; }
.v6-lampbtn:hover { filter:brightness(1.18); }
.v6-inp.v6-time { width:60px; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
.v6-pmain .big { display:flex; align-items:baseline; gap:7px; margin-top:4px; }
.v6-pmain .big .v { font:700 19px var(--serif); color:#ffe8c0; font-variant-numeric:tabular-nums; text-shadow:0 1px 2px #000; }
.v6-pmain .big .up { font-size:10px; color:var(--ok); }
.v6-pmain .minis { display:flex; gap:10px; margin-top:4px; font-size:10px; color:var(--mut); flex-wrap:wrap; min-height:14px; }
.v6-pmain .minis .warn { color:var(--warn); }
.v6-stats { display:flex; gap:12px; margin-top:6px; flex-wrap:wrap; }
.v6-stats .lb { font-size:10px; color:var(--mut); }
.v6-stats b { font-size:13px; color:#ffe8c0; font-weight:600; margin-left:4px; }
/* 固定高度操作槽：三模式同位（圆钮行），切换零跳动 */
.v6-opslot { height:42px; margin-top:6px; display:flex; align-items:center; gap:8px; }
/* 子区域 chips（下钻） */
.v6-subchips { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
.v6-subchips .sc { display:inline-flex; align-items:center; gap:3px; padding:3px 9px; border-radius:5px;
                   background:#2c2113; border:1px solid var(--line); font-size:10px; cursor:pointer; }
.v6-subchips .sc:hover { border-color:var(--gold); color:#ffe8c0; }
/* 右槽区域卡：子区域行 + 父链上钻 */
.v6-subrow { display:flex; align-items:center; gap:7px; padding:4px 6px; border-radius:5px; font-size:11px; cursor:pointer; }
.v6-subrow:hover { background:rgba(138,95,42,.18); }
.v6-subrow .tx { flex:1; }
.v6-subrow .hint { font-size:9px; color:var(--faint); }
.v6-crumbs { display:flex; align-items:center; font-size:10px; color:var(--mut); margin:0 0 6px; }
.v6-crumbs .up1 { cursor:pointer; color:var(--info); }
.v6-crumbs .up1:hover { color:var(--gold); text-decoration:underline; }
/* 圆钮行（金属圆盘操作钮，操作槽内） */
.v6-fns { display:flex; gap:8px; align-items:center; }
.v6-fnc { width:38px; height:38px; border-radius:50%;
          background:radial-gradient(circle at 38% 32%, #3e2f1a, #1d150c 78%);
          border:2px solid var(--lineH); box-shadow:0 0 0 1px #120c06, inset 0 1px 0 rgba(233,200,130,.15);
          display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; }
.v6-fnc:hover { border-color:var(--gold); box-shadow:0 0 0 1px #120c06, 0 0 10px rgba(217,169,92,.3); }
/* 探索看板：环境 + 目标 + 队伍列表 */
.v6-exhd { display:flex; align-items:center; gap:8px; }
.v6-exhd .nm { font:700 14px var(--serif); color:#ffe8c0; letter-spacing:1px; }
.v6-exhd .env { font-size:10px; color:var(--mut); }
.v6-exgoal { display:flex; align-items:center; gap:7px; margin-top:4px; font-size:11px; }
.v6-exgoal .pg { color:var(--ac); font-weight:600; font-variant-numeric:tabular-nums; }

/* ---------- 右列：环境组 + 实体槽（恒定） ---------- */
.v6-rcol { position:absolute; right:10px; top:38px; bottom:60px; width:262px; z-index:8; display:flex; flex-direction:column; gap:8px; }
/* ---------- 最右上角系统钮 ---------- */
.v6 .v6-syscorner[data-sysmenu] { position:absolute; top:8px; right:10px; z-index:9; }

.v6-mapbox { flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:5px; position:relative; }
/* 小地图：罗盘三环 */
.v6-minimap { width:118px; height:118px; border-radius:50%; cursor:pointer; position:relative; overflow:hidden; margin-top:6px;
  background:radial-gradient(circle at 40% 35%, #3a2f1e 0%, #241c12 45%, #14100b 80%),
  repeating-linear-gradient(45deg, rgba(224,170,85,.05) 0, rgba(224,170,85,.05) 2px, transparent 2px, transparent 12px);
  border:3px solid #7a5a30; box-shadow:0 0 0 1px #14100b, 0 0 0 2px #55402a, 0 4px 18px rgba(0,0,0,.5); }
.v6-minimap:hover { border-color:var(--gold); }

            background:linear-gradient(160deg,#2e2413,#221a0e); border:1px solid var(--lineH);
            box-shadow:0 0 0 1px #120c06, 0 4px 14px rgba(0,0,0,.55); border-radius:8px; padding:5px 8px; }
.v6-3dact.on { display:flex; }
.v6-3dbtn { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:5px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid var(--lineH); }
.v6-3dbtn.ok { background:linear-gradient(180deg,#7a9a4a,#5a7a34); border-color:var(--ok); color:#101a06; }
.v6-3dbtn.cancel { background:#2c2113; color:var(--mut); }
.v6-3dbtn.cancel:hover { border-color:var(--warn); color:var(--warn); }
.v6-3dbtn .kbd { font-size:8px; opacity:.75; }
/* ---------- C 弹层栈 ---------- */
.v6-cdrawer { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
              width:min(74%,760px); height:min(80%,640px); z-index:31;
              background:linear-gradient(160deg,#2e2413,#221a0e); border:1px solid var(--gold2); border-radius:12px;
              box-shadow:0 20px 60px rgba(0,0,0,.6), inset 1px 0 0 rgba(214,176,106,.2);
              display:none; flex-direction:column; overflow:hidden; }
.v6-cdrawer.on { display:flex; }
.v6-cdrawer.auto { height:auto; max-height:min(84%,640px); }
.v6-cdrawer.auto .v6-cdbd { flex:0 1 auto; max-height:540px; }
.v6-cdrawer.wide { width:min(86%,880px); }
.v6-dhd { display:flex; align-items:center; gap:8px; padding:10px 13px; border-bottom:1px solid var(--line);
          font:700 12px var(--serif); letter-spacing:1px; color:#ffe8c0; }
.v6-dhd .x { margin-left:auto; cursor:pointer; color:var(--faint); padding:2px 6px; border-radius:4px; }
.v6-dhd .x:hover { color:var(--bad); }
.v6-cdbd { flex:1; overflow-y:auto; padding:11px 13px; display:flex; flex-direction:column; gap:9px; }
.v6-overlay { position:absolute; inset:0; background:rgba(8,5,2,.74); z-index:30; display:none; }
.v6-overlay.on { display:block; }
.v6-cmodal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
             width:min(74%,760px); height:min(80%,640px); z-index:32;
             background:#1d1610; border:1px solid var(--gold2); border-radius:12px; display:none; flex-direction:column; overflow:hidden;
             box-shadow:0 0 0 1px #120c06, 0 14px 40px rgba(0,0,0,.65); }
.v6-cmodal.on { display:flex; }
.v6-mhd { display:flex; align-items:center; gap:8px; padding:11px 16px; border-bottom:1px solid var(--line); background:#241b10;
          font:700 13px var(--serif); letter-spacing:1px; color:#ffe8c0; }
.v6-mhd .esc-hint { margin-left:auto; font-size:10px; color:var(--mut); }
.v6-mhd .x { cursor:pointer; padding:3px 10px; border-radius:5px; background:#5c4020; font-size:11px; }
.v6-mbd { flex:1; overflow:auto; padding:13px 16px; display:flex; gap:14px; }
.v6-mcol { flex:1; display:flex; flex-direction:column; gap:9px; }
.v6-cform { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:420px; z-index:31;
            background:linear-gradient(160deg,#2e2413,#221a0e); border:1px solid var(--lineH); border-radius:11px;
            box-shadow:0 0 0 1px #120c06, 0 14px 40px rgba(0,0,0,.65); display:none; flex-direction:column; overflow:hidden; }
.v6-cform.on { display:flex; }
.v6-cform .fbd { padding:12px 14px; max-height:400px; overflow-y:auto; }
.v6-cform .frow { display:flex; align-items:center; gap:8px; margin:7px 0; font-size:12px; }
.v6-cform .frow .lb { width:64px; color:var(--mut); flex-shrink:0; }
.v6-cform .frow .ro { margin-left:auto; color:var(--mut); }
.v6-cform .fok { display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
/* NPC 对话（暗紫叙事容器，与系统面板区分） */
.v6-cdlg { position:absolute; left:50%; transform:translateX(-50%); bottom:64px; width:56%; z-index:28; background:#1d1424;
           border:1px solid #6a4a8a; border-radius:12px; padding:13px 18px; display:none;
           box-shadow:0 0 0 1px #0d0812, 0 10px 30px rgba(0,0,0,.6); }
.v6-cdlg.on { display:block; }
.v6-dlg-name { color:#c8a8e8; font:700 13px var(--serif); margin-bottom:5px; }
.v6-dlg-text { color:#d8d0e4; font-size:12px; line-height:1.7; }
.v6-dlg-opts { display:flex; gap:8px; margin-top:10px; }
.v6-dlg-opt { flex:1; text-align:center; background:#241a34; border:1px solid #4a3a6a; border-radius:6px; padding:7px 10px; cursor:pointer; font-size:12px; }
.v6-dlg-opt:hover { border-color:#8a6aba; }
/* Toast（纸条） */
.v6-toasts { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:40; display:flex; flex-direction:column; gap:6px; align-items:center; pointer-events:none; }
.v6-toast { background:rgba(24,18,10,.95); border:1px solid var(--ok); color:var(--ok); border-radius:7px; padding:6px 14px;
            font-size:11px; box-shadow:0 0 0 1px #120c06, 0 4px 12px rgba(0,0,0,.5); animation:v6tin .25s; }
.v6-toast.warn { border-color:var(--warn); color:var(--warn); }
@keyframes v6tin { from { opacity:0; transform:translateY(-6px); } }
.v6-dmg { position:absolute; z-index:6; font-size:15px; font-weight:700; color:var(--bad); text-shadow:0 1px 3px #000; animation:v6dmg 1s forwards; pointer-events:none; }
@keyframes v6dmg { 0% { opacity:0; transform:translateY(6px); } 20% { opacity:1; } 100% { opacity:0; transform:translateY(-22px); } }
.v6-locator { position:absolute; border:2px dashed var(--gold); border-radius:6px; pointer-events:none; z-index:5; }
.v6-locator .nm { position:absolute; top:-19px; left:0; background:#161009; border:1px solid var(--gold); border-radius:4px; padding:1px 6px; font-size:10px; color:var(--gold); white-space:nowrap; }
/* 回合序（遭遇） */
.v6-turnstrip { display:flex; align-items:center; gap:4px; }
.v6-turnstrip .round { font:700 10px var(--serif); color:var(--ac); margin-right:3px; white-space:nowrap; letter-spacing:1px; }
.v6-turnunit { width:22px; height:22px; border-radius:5px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; }
.v6-turnunit.frd { background:#2a3a26; } .v6-turnunit.foe { background:#3a2222; }
.v6-turnunit.cur { border-color:var(--ac); box-shadow:0 0 0 1px var(--ac2); }
.v6-turnunit.dead { opacity:.3; }
/* tooltip */
.v6 [data-tt] { position:relative; }
.v6 [data-tt]:hover::after { content:attr(data-tt); position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
  background:#241b0e; border:1px solid var(--lineH); border-radius:4px; padding:3px 8px; font-size:10px; white-space:nowrap; color:var(--txt); z-index:50; pointer-events:none; }
.v6 .tt-dn[data-tt]:hover::after { bottom:auto; top:calc(100% + 6px); }

/* ---------- 建造重构：左列工具配置 / 底部库行 / 左下详情横板 / 隐藏玩家轨 ---------- */
/* 建造态隐藏左轨玩家域（背包/任务是经营·探索内容） */
.v6-screen[data-mode="build"] .v6-side { display:none; }
/* 左列：工具配置卡（纯参数，无操作按钮；底部锚定，从下往上长，不压二级排） */
.v6-cfg { position:absolute; left:10px; bottom:108px; width:264px; z-index:7; display:none; }
.v6-cfg.on { display:block; }
.v6-cfg .v6-icard { max-height:300px; }
.v6-cfg .v6-cfghd { display:flex; align-items:center; gap:6px; font:700 12px var(--serif); color:#ffe8c0; margin-bottom:5px; }
.v6-cfg .v6-cfghd .sub { font:400 9px sans-serif; color:var(--mut); }
.v6-cfg .v6-cfghd .rst { margin-left:auto; cursor:pointer; color:var(--faint); font-size:13px; padding:1px 5px; border-radius:4px; }
.v6-cfg .v6-cfghd .rst:hover { color:var(--gold); background:rgba(217,169,92,.12); }
.v6-cfg .keyhint { margin-top:8px; font-size:10px; color:var(--faint); }
/* 选区分区（配置列内，有选区时出现） */
.v6-selsec { margin-top:8px; border-top:1px dashed var(--lineH); padding-top:6px; }
.v6-selsec .v6-sec { margin-top:0; }
/* 底部库行（常驻，居中，只占底部中部；内容完全跟随当前工具，无类型切换列） */
.v6-lib { position:absolute; left:50%; transform:translateX(-50%); width:720px; bottom:104px; height:152px; z-index:9; display:none;
          background:linear-gradient(160deg,#2e2413,#221a0e); border:1px solid var(--lineH); border-radius:10px;
          box-shadow:0 0 0 1px #120c06, 0 -6px 24px rgba(0,0,0,.55); overflow:hidden; }
.v6-lib.on { display:flex; }
.v6-lib.slim { height:auto; width:auto; padding:4px 6px; }
/* 二级工具排（底带上方的第二排：当前一级组的二级工具；无二级则留空） */
.v6-b2 { position:absolute; left:0; right:0; bottom:54px; height:46px; z-index:10; display:none; align-items:stretch; justify-content:center;
         padding:7px 12px 5px; background:linear-gradient(180deg,rgba(20,14,8,.78),rgba(17,12,7,.92));
         border-top:1px solid var(--line); }
/* 建造态底带：历史组钉左，工具组居中 */
.v6-b .v6-bgrp.abs-l { position:absolute; left:12px; top:0; bottom:0; }
.v6-b .v6-bgrp.abs-l + .v6-bgrp { border-left:none; }
.v6-libmain { flex:1; display:flex; flex-direction:column; min-width:0; padding:7px 9px; }
.v6-libsub { display:flex; align-items:center; gap:5px; margin-bottom:6px; flex-wrap:wrap; }
.v6-libsearch { margin-left:auto; width:110px; }
.v6-libgrid { flex:1; display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:6px; overflow-y:auto; align-content:start; }
.v6-lcell { height:52px; border-radius:6px; border:1px solid var(--line); cursor:pointer; position:relative;
            display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px #120c06; }
.v6-lcell:hover { border-color:var(--gold); }
.v6-lcell.on { border:2px solid var(--gold); }
.v6-lcell .nm { position:absolute; bottom:1px; left:4px; font-size:8px; color:rgba(255,240,220,.85); text-shadow:0 1px 2px #000; }
.v6-lcell .pr { position:absolute; top:1px; right:4px; font-size:8px; color:var(--warn); text-shadow:0 1px 2px #000; }
.v6-libinfo { flex:none; width:176px; border-left:1px solid var(--line); padding:9px 11px; display:flex; flex-direction:column; gap:5px; }
.v6-libinfo .nm { font:700 12px var(--serif); color:#ffe8c0; }
.v6-libinfo .row { font-size:10px; color:var(--mut); line-height:1.5; }
.v6-libctl { flex:none; padding:7px 4px 0 2px; }
.v6-libctl span { cursor:pointer; color:var(--faint); padding:2px 5px; font-size:11px; }
.v6-libctl span:hover { color:var(--warn); }
/* 右侧：选中详情卡（区域/子区域/角色；环境组下方，竖排，三模式同位；体素选区在配置列） */
.v6-dpanel { position:absolute; right:10px; bottom:62px; z-index:7; display:none; max-width:320px; max-height:calc(100% - 120px); overflow-y:auto; }
.v6-dpanel.on { display:block; }
.v6-dcard { display:flex; flex-direction:column; gap:8px; align-items:stretch; padding:10px 13px; max-height:400px; overflow-y:auto; width:296px; }
.v6-dcard.sel-obj { border-left:3px solid var(--gold); }
.v6-dcard.tool-card { border-left:3px solid #b98a52; }
/* 面板内 TAB */
.v6-tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); padding-bottom:7px; margin-bottom:9px; }
.v6-tab { padding:6px 15px; border-radius:7px; font-size:12px; cursor:pointer; border:1px solid var(--line);
          background:#241a0e; color:var(--mut); box-shadow:0 0 0 1px #120c06; }
.v6-tab:hover { color:var(--gold); border-color:var(--gold2); }
.v6-tab.on { background:linear-gradient(180deg,#5c4020,#43301a); border-color:var(--gold); color:#ffe8c0; }
/* 人员：左概览 + 右详情 */
.v6-region { display:flex; gap:12px; align-items:flex-start; }
.v6-regionl { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.v6-regionr { width:280px; flex:none; }
.v6-ovhead { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.v6-ovname { flex:1; min-width:0; }
.v6-ovname b { display:block; font-size:14px; color:#ffe8c0; white-space:nowrap; }
.v6-ovsub { font-size:10px; color:var(--mut); }
.v6-ovgrid { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
.v6-ovcell { display:flex; justify-content:space-between; gap:8px; padding:5px 2px; border-bottom:1px solid rgba(74,56,38,.4); font-size:11px; }
.v6-pager { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:8px; }
.v6-assetsum { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.v6-assetsum > div { border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:rgba(20,15,9,.35); display:flex; flex-direction:column; gap:2px; }
.v6-assetsum span { font-size:9px; color:var(--mut); }
.v6-assetsum b { font:700 15px var(--serif); color:#ffe8c0; }
.v6-loanrow { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:9px; color:var(--mut); }
.v6-loanrow b { font-size:10px; font-weight:600; }
.v6-transfer { display:grid; grid-template-columns:150px 1fr 150px; gap:10px; align-items:center; }
.v6-taccount { border:1px solid var(--line); border-radius:7px; padding:8px; text-align:center; background:rgba(20,15,9,.35); }
.v6-taccount .lbl { font-size:10px; color:var(--gold2); }
.v6-taccount .bal { font:700 20px var(--serif); color:#ffe8c0; }
.v6-taccount .sub { font-size:9px; color:var(--mut); }
.v6-tslider { min-width:0; }
.v6-tlabel { text-align:center; font-size:10px; color:var(--mut); margin-bottom:2px; }
.v6-tends { display:flex; justify-content:space-between; font-size:9px; color:var(--faint); }
.v6-acctmain { border:1px solid var(--lineH); border-radius:8px; padding:10px 12px; background:linear-gradient(160deg,#332716,#241b0e); }
.v6-acctmain .lbl { font-size:10px; color:var(--gold2); letter-spacing:1px; }
.v6-acctmain .bal { font:700 26px var(--serif); color:#ffe8c0; margin-top:2px; }
.v6-acctmain .sub { font-size:9px; color:var(--mut); }
.v6-walletline { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:10px; color:var(--mut); }
.v6-walletline b { color:#ffe8c0; font-size:12px; }
.v6-dirrow { display:flex; gap:6px; margin-bottom:6px; }
.v6-range { width:100%; accent-color:#c9a25e; }
.v6-rangeinfo { display:flex; justify-content:space-between; font-size:10px; color:var(--mut); margin-top:2px; }
.v6-rangeinfo b { color:#ffe8c0; }
.v6-loanlist, .v6-loanoffers { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:6px; }
.v6-loancard { border:1px solid var(--line); border-radius:6px; padding:7px 8px; background:rgba(20,15,9,.35); display:flex; flex-direction:column; gap:3px; }
.v6-loancard .nm { font-weight:600; color:#ffe8c0; font-size:11px; }
.v6-loancard .bal { font-size:12px; color:var(--gold2); }
.v6-loancard .sub { font-size:9px; color:var(--mut); }
.v6-loancard .act { display:flex; justify-content:flex-end; margin-top:2px; }
.v6-assetgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.v6-assetcard { border:1px solid var(--line); border-radius:7px; padding:8px; text-align:center; background:rgba(20,15,9,.35); }
.v6-assetcard .ic { font-size:20px; }
.v6-assetcard .nm { font-size:10px; color:#ffe8c0; margin-top:2px; }
.v6-assetcard .tag { font-size:9px; color:var(--mut); }
.v6-assetcard .pl { font-size:9px; color:var(--gold2); margin-top:3px; }
.v6-baggrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.v6-bagcard { border:1px solid var(--line); border-radius:7px; padding:8px; background:rgba(20,15,9,.35); display:flex; flex-direction:column; gap:4px; }
.v6-bagcard .hd { display:flex; align-items:center; gap:6px; }
.v6-bagcard .hd .ic { font-size:18px; }
.v6-bagcard .hd .nm { flex:1; font-weight:600; color:#ffe8c0; font-size:11px; }
.v6-bagcard .qty { font-size:10px; color:var(--gold2); }
.v6-bagcard .note { font-size:9px; color:var(--mut); }
.v6-bagcard .act { display:flex; justify-content:flex-end; gap:6px; margin-top:auto; }
.v6-prodgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(195px,1fr)); gap:6px; }
.v6-prodcard { border:1px solid var(--line); border-radius:7px; padding:8px; background:rgba(20,15,9,.35); display:flex; flex-direction:column; gap:5px; }
.v6-prodhd { display:flex; align-items:center; gap:6px; }
.v6-prodhd .ic { font-size:18px; }
.v6-prodhd .nm { flex:1; font-weight:600; color:#ffe8c0; font-size:12px; }
.v6-prodprice { display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:11px; color:var(--gold2); }
.v6-prodstock { color:var(--mut); font-size:10px; }
.v6-mats { display:flex; align-items:center; flex-wrap:wrap; gap:4px; font-size:9px; color:var(--mut); }
.v6-mats .mlb { color:var(--faint); margin-right:2px; }
.v6-mat { border:1px solid var(--line); border-radius:4px; padding:1px 5px; background:rgba(20,15,9,.4); }
.v6-prodact { display:flex; justify-content:flex-end; gap:6px; margin-top:auto; }
.v6-goods { display:flex; gap:10px; align-items:flex-start; }
.v6-goods-l { flex:1; min-width:0; }
.v6-goods-r { width:300px; flex:none; }
.v6-prow { padding:5px 6px; border-bottom:1px solid rgba(74,56,38,.4); font-size:11px; }
.v6-prow:last-child { border-bottom:none; }
.v6-prow .r1 { display:flex; align-items:center; gap:6px; }
.v6-prow .r1 .nm { flex:1; color:#ffe8c0; }
.v6-prow .r2 { color:var(--mut); font-size:9px; margin-top:2px; }
.v6-inv { display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:6px; }
.v6-invbar { display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.v6-invquick { margin-left:auto; display:flex; gap:6px; }
.v6-invcard { border:1px solid var(--line); border-radius:5px; padding:5px 6px; background:rgba(20,15,9,.35); display:flex; flex-direction:column; gap:1px; }
.v6-invhd { display:flex; align-items:center; gap:4px; margin-bottom:1px; }
.v6-invhd .nm { flex:1; font-weight:600; color:#ffe8c0; font-size:10px; }
.v6-invrow { display:flex; align-items:center; justify-content:space-between; gap:4px; font-size:9px; color:var(--mut); }
.v6-invrow b { color:#ffe8c0; font-size:10px; font-weight:600; }
.v6-invfoot { display:flex; justify-content:flex-end; margin-top:1px; }
.v6-invfoot .v6-opt { padding:1px 6px; font-size:9px; }
.v6-split { display:flex; gap:10px; align-items:flex-start; }
.v6-splitl { width:238px; flex:none; display:flex; flex-direction:column; gap:6px; max-height:430px; overflow-y:auto; padding-right:2px; }
.v6-splitr { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; max-height:430px; overflow-y:auto; padding-right:2px; }
.v6-pcard { padding:7px 10px; border-radius:8px; background:#241a0e; border:1px solid var(--line);
            box-shadow:0 0 0 1px #120c06; cursor:pointer; }
.v6-pcard:hover { border-color:var(--gold2); }
.v6-pcard.on { border-color:var(--gold); background:#33240f; }
.v6-pcard .r1 { display:flex; align-items:center; gap:6px; font-size:12px; color:#ffe8c0; }
.v6-pcard .r1 .nm { flex:1; }
.v6-pcard .r2, .v6-pcard .r3 { font-size:9px; color:var(--mut); margin-top:2px; }
.v6-pcard .onb { font-size:9px; padding:1px 6px; border-radius:8px; border:1px solid transparent; }

/* ---------- 建造：工具参数（左列配置卡复用） ---------- */
function tState(key,def){ if(!TOOL_STATE[TOOL])TOOL_STATE[TOOL]={}; return TOOL_STATE[TOOL][key]!==undefined?TOOL_STATE[TOOL][key]:def; }
function chipsParam(key,list){ var cur=tState(key,list[0]);

       (TOOL==='几何选择'?'<div class="v6-gt" style="margin-top:6px">形状</div>'+chipsParam('shape',['立方','球','圆柱']):'<div class="v6-gt" style="margin-top:6px">笔刷</div>'+chipsParam('brush',['圆形','方形','立体']))+'</div>'+

  }else if(TOOL==='区域'){

       '<div class="v6-gt" style="margin-top:6px">墙壁</div>'+chipsParam('wall',['上','下','左','右','前','后'])+'</div>'+
       '<div class="v6-none" style="margin-top:8px">两点确认范围后，弹出区域业务数据表单</div>';
  }else if(TOOL==='剖切框'){

       '<div class="v6-row"><span class="lb">最小</span><input class="v6-inp" value="0"><input class="v6-inp" value="0"><input class="v6-inp" value="0"></div>'+
       '<div class="v6-row"><span class="lb">最大</span><input class="v6-inp" value="10"><input class="v6-inp" value="10"><input class="v6-inp" value="8"></div></div>';

<script>
/* ============================================================
   B 底带：模式操作域
   - 经营：收起（操作在左上）
   - 建造：历史│工具（纯动作流；执行在世界内 ✓✕ 浮标 + Enter/RMB；料在库行）
   - 探索：自由=快捷道具/扎营；遭遇=行动条
   ============================================================ */
function renderB(){
  var b=document.getElementById('v6B');
  if(MODE==='manage'){ b.style.display='flex'; b.style.justifyContent='center'; b.innerHTML=bManage(); renderB2(); return; }
  b.style.display='flex';
  if(MODE==='build'){ b.style.justifyContent='center'; b.innerHTML=bBuild(); renderB2(); return; }
  b.style.justifyContent='';
  b.innerHTML=EXP==='combat'?bCombat():bExploreFree();
  renderB2();
}
/* 经营底带：业务键（作用对象恒等于左上锚的主域 MAIN_DOMAIN）
   模式切换在锚的建造按钮与大地图，时间在环境卡时钟，均不在此重复 */
function bManage(){
  var isDist=(MAIN_DOMAIN==='district');
  var keys=(isDist
      ? [['🏪','资产'],['🛡','权限'],['🎪','活动'],['🎖','许可']]
      : [['🛠','工作'],['📦','货物'],['🛡','权限'],['🎪','活动'],['🎖','许可']]
    ).map(function(f){ return '<span class="v6-bbtn tt-dn" data-fn="'+f[1]+'" data-tt="'+f[1]+'">'+f[0]+' '+f[1]+'</span>'; }).join('');
  var main='<div class="v6-bgrp" style="margin:0 auto"><span class="glb">业务 · '+(isDist?'商业街':'我的酒店')+'</span>'+keys+'</div>';
  var person='<div class="v6-bgrp" style="position:absolute;left:12px;top:8px">'+
    '<span class="v6-bbtn tt-dn" data-fn="人员" data-tt="人员详情">👥 人员</span></div>'+
    '<span class="v6-stafftoggle" data-staffcard="1">展开</span>';
  return main+person;
}
/* 工具按钮（一级排/二级排共用） */
function bToolBtn(t){ return '<span class="v6-bbtn'+(TOOL===t.t?' on':'')+(t.soon?' dis':'')+'" data-tool="'+t.t+'" data-tt="'+(t.soon?t.t+' · 敬请期待':t.t+(t.kbd?' · 键 '+t.kbd:''))+'">'+t.icon+' '+t.t+'</span>'; }
function bBuild(){
  var g1='<div class="v6-bgrp abs-l"><span class="glb">历史</span>'+
    '<span class="v6-hbtn'+(HIST.length?'':' dis')+'" data-undo="1" data-tt="撤销 Ctrl+Z">↺</span>'+
    '<span class="v6-hbtn'+(FUT.length?'':' dis')+'" data-redo="1" data-tt="重做 Ctrl+Y">↻</span>'+
    '<span class="v6-hbtn" data-hist="1" data-tt="历史记录">🕘</span></div>';
  /* 下排 = 一级（组 + 独立工具），居中 */
  var curG=toolGroupOf(TOOL);
  var g2='<div class="v6-bgrp"><span class="glb">一级</span>'+
    TOOL_GROUPS.map(function(g){ return '<span class="v6-bbtn'+(curG===g.g?' on':'')+'" data-tgroup="'+g.g+'" data-tt="'+g.g+'组 · 点击激活最近所用工具">'+g.icon+' '+g.g+'</span>'; }).join('')+
    TOOL_FIRST.map(bToolBtn).join('')+'</div>';
  return g1+g2;
}
/* 上排 = 当前一级组的二级工具；无二级（区域/剖切框/采样）则留空 */
function renderB2(){
  var b2=document.getElementById('v6B2');
  if(MODE!=='build'){ b2.style.display='none'; b2.innerHTML=''; return; }
  b2.style.display='flex';
  var curG=toolGroupOf(TOOL);
  b2.innerHTML='<div class="v6-bgrp"><span class="glb">二级'+(curG?' · '+curG:'')+'</span>'+
    (curG?TOOL_GROUPS.filter(function(x){return x.g===curG;})[0].tools.map(bToolBtn).join(''):'')+'</div>';
}
/* 探索·自由：队伍（点击→左下详情横板角色卡）+ 快捷道具 + 扎营/场景切换（收纳在左轨背包） */
function bExploreFree(){
  var ports=TEAM.map(function(n){ var c=CHAR_DATA[n];
    return '<div class="v6-portrait tt-dn'+(SEL&&SEL.type==='char'&&SEL.id===n?' cur':'')+(c.hp<=0?' dead':'')+'" data-sel-char="'+n+'" data-tt="'+n+' · HP '+c.hp+'%">'+c.av+'<div class="hpbar"><i style="width:'+c.hp+'%"></i></div></div>'; }).join('');
  var qs=QUICK_ITEMS.map(function(q){ return '<div class="v6-qslot tt-dn" data-useitem="'+q[1]+'" data-tt="使用 '+q[1]+' ×'+q[2]+'">'+q[0]+'<span class="ct">'+q[2]+'</span></div>'; }).join('');
  var foes=FOES.filter(function(f){return FOE_DATA[f].hp>0;}).length;
  return '<div class="v6-bgrp"><span class="glb">队伍</span>'+ports+'</div>'+
    '<div class="v6-bgrp"><span class="glb">快捷使用</span>'+qs+'</div>'+
    '<div class="v6-bgrp"><span class="glb">探索</span>'+
      '<span class="v6-bbtn" data-fn="扎营">⛺ 扎营</span>'+
      '<span class="v6-bbtn" data-openmap="1">🗺 场景切换 <span class="kbd">M</span></span></div>'+
    '<div class="v6-b-sp"></div>'+
    (MAP==='forest'&&foes>0?'<div class="v6-bgrp"><span style="font-size:10px;color:var(--warn)">⚠ 附近有敌意目标 —— 点击敌人查看，可进入遭遇战</span></div>':'');
}
/* 探索·遭遇 */
function bCombat(){
  var order=turnOrder(), u=order[CUR_UNIT], c=u.data;
  var ports=TEAM.map(function(n,i){ var cc=CHAR_DATA[n];
    return '<div class="v6-portrait'+(u.nm===n?' cur':'')+(cc.hp<=0?' dead':'')+'" data-unit="'+i+'" data-tt="'+n+'">'+cc.av+
      '<div class="hpbar"><i style="width:'+cc.hp+'%"></i></div></div>'; }).join('');
  var skills=SKILLS.map(function(s,i){ var dis=c.ap<s[2];
    return '<div class="v6-skill'+(ARMED===i?' armed':'')+(dis?' dis':'')+'" data-skill="'+i+'" data-tt="'+s[1]+' · '+s[2]+'AP">'+s[0]+'<span class="ap">'+s[2]+'</span></div>'; }).join('');
  return '<div class="v6-bgrp"><span class="glb">队伍</span>'+ports+'</div>'+
    '<div class="v6-bgrp"><span class="glb">行动 · '+u.nm+' AP '+c.ap+'/'+c.apMax+'</span>'+skills+'</div>'+
    '<div class="v6-b-sp"></div>'+
    '<div class="v6-bgrp"><div class="v6-endturn" data-endturn="1"><span class="lb">⏭ 结束回合</span><span class="sub">空格</span></div></div>';
}
function turnOrder(){
  var o=[{nm:'莉拉',av:'👩',foe:false,data:CHAR_DATA['莉拉']},
         {nm:'老周',av:'👨',foe:false,data:CHAR_DATA['老周']},
         {nm:'小满',av:'👧',foe:false,data:CHAR_DATA['小满']}];
  FOES.forEach(function(f){ o.push({nm:f,av:FOE_DATA[f].av,foe:true,data:FOE_DATA[f]}); });
  return o;
}

/* ---------- 库行：内容 = f(当前工具)；左端类型行兼做放置工具入口（双入口，单一事实源=TOOL+MATERIAL） ---------- */
function renderLib(){
  var el=document.getElementById('v6Lib');
  var type=TOOL_LIB[TOOL];
  if(MODE!=='build'||!type){ el.className='v6-lib'; el.innerHTML=''; renderDetail(); return; }
  if(LIB_COLLAPSED){ el.className='v6-lib on slim';
    el.innerHTML='<span class="v6-bbtn" data-expand-lib="1">▴ '+LIBS[type].nm+'库 · '+MATERIAL.nm+'</span>';
    renderDetail(); return; }
  el.className='v6-lib on';
  el.innerHTML=
    '<div class="v6-libmain"><div class="v6-libsub">'+
      '<input class="v6-inp v6-libsearch" data-libsearch="1" placeholder="🔍 搜索'+LIBS[type].nm+'…" value="'+LIB_Q+'"></div>'+
    '<div class="v6-libgrid" id="v6LibGrid">'+libCells(type,libFiltered(type))+'</div></div>'+
    '<div class="v6-libinfo">'+libInfo(type)+'</div>'+
    '<div class="v6-libctl"><span data-collapse-lib="1" data-tt="收起库行">✕</span></div>';
  renderDetail();
}
function libFiltered(type){
  return LIBS[type].items.filter(function(nm){ return !LIB_Q||nm.indexOf(LIB_Q)>=0; });
}
function libCells(type,items){
  if(!items.length)return '<div class="v6-none" style="padding:10px">（无匹配）</div>';
  return items.map(function(nm){
    var i=LIBS[type].items.indexOf(nm), on=MATERIAL.nm===nm&&MATERIAL.kind===type;
    var ic=(LIB_ICONS[type]||{})[nm], hue=(i*37+nm.length*13)%360;
    var inner=ic?'<span style="font-size:20px">'+ic+'</span>':'';
    var bg=ic?'background:rgba(40,30,18,.6)':'background:hsl('+hue+',24%,34%)';
    return '<div class="v6-lcell'+(on?' on':'')+'" style="'+bg+'" data-mat="'+type+':'+i+':'+nm+'" data-tt="'+nm+' · '+priceOf(nm)+'">'+inner+'<span class="pr">'+priceOf(nm)+'</span><span class="nm">'+nm+'</span></div>';
  }).join('');
}
function libInfo(type){
  var nm=(MATERIAL.kind===type?MATERIAL.nm:LIBS[type].items[0]), pr=priceOf(nm);
  if(type==='block')return '<div class="nm">'+nm+'</div><div class="row">💰 '+pr+' / 格 · 库存 320</div><div class="row">用于：单格 / 几何工具</div><div class="row">拿起后在世界中点击/拖拽放置</div>';
  if(type==='template')return '<div class="nm">'+nm+'</div><div class="row">💰 '+pr+' · 占地 12×18×8</div><div class="row">需求：石材砖×80 · 木料×20</div><div class="row">点击拿起 → 世界中定位 → Gizmo 微调</div>';
  if(type==='furniture')return '<div class="nm">'+nm+'</div><div class="row">💰 '+pr+' · 占地 2×1</div><div class="row">R 旋转朝向 · 长按已放置实例可拾取</div>';
  return '<div class="nm">'+nm+'</div><div class="row">区域类型</div><div class="row">世界中两点确认范围后，弹出业务数据表单</div>';
}
/* ---------- 左列：工具配置卡（纯参数 + 选区分区；执行在世界内浮标，这里无操作按钮） ---------- */
function renderCfg(){ renderDetail(); }
/* ---------- 历史下拉 ---------- */
function renderHistPop(){
  var p=document.getElementById('v6HistPop');
  if(!p.classList.contains('on'))return;
  var rows=HIST.slice().reverse().map(function(h,i){ return '<div class="v6-histrow'+(i===0?' cur':'')+'">↩ '+h.t+'<span class="t">'+h.time+'</span></div>'; }).join('');
  var fut=FUT.slice().reverse().map(function(h){ return '<div class="v6-histrow" style="opacity:.5">↪ '+h.t+'<span class="t">'+h.time+'</span></div>'; }).join('');
  p.innerHTML='<div class="gt">🕘 历史记录（上限 50 · Ctrl+Z/Y 步进）</div>'+(fut+rows||'<div class="v6-none">（暂无操作）</div>');
}
function toggleHistPop(){
  var p=document.getElementById('v6HistPop');
  if(p.classList.contains('on')){ p.classList.remove('on'); escPop('histpop'); return; }
  p.classList.add('on'); renderHistPop();
  escPush('histpop',function(){ p.classList.remove('on'); });
}
/* 环境组抽屉：时间 / 高度 / 渲染图层 / 剖切框 —— 各自独立开合，不互斥、不自动收起；
   仅再次点击对应拉片/按钮才收起；重绘后由 syncEnvPops 恢复 */
var ENVPOPS=['v6TimePop','v6HeightPop','v6LayPop','v6CutPop'];
var ENVPOP_OPEN={};
function toggleEnvPop(id){
  ENVPOP_OPEN[id]=!ENVPOP_OPEN[id];
  syncEnvPops();
}
function syncEnvPops(){
  ENVPOPS.forEach(function(x){ var el=document.getElementById(x); if(el)el.classList.toggle('on',!!ENVPOP_OPEN[x]); });
  var tabs=document.querySelectorAll('.v6-etab');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('on',!!ENVPOP_OPEN[tabs[i].dataset.envpop]);
}
</script>

function switchMode(m){
  if(m===MODE)return;
  if(m==='explore'){ travel('forest'); return; }
  MODE=m; syncModeAttr(); closeAllLayers(); clearSel(); setPlaceSilent();
  if(m==='build')MAIN_DOMAIN='shop'; /* 建造绑定店铺资金，强制回店铺主域 */

}

function travel(key){
  closeModal(); closeCForm();

  else{ MAP=key; MODE='explore'; }
  syncModeAttr(); delete document.getElementById('v6Scr').dataset.combat;
  EXP='free'; ARMED=null; CUR_UNIT=0; CUR_ROUND=1;
  closeAllLayers(); clearSel(); setPlaceSilent();

/* 路径读写：goods:2:price / restock:qty / lease:0:rent */
function bizRef(path){
  var p=path.split(':'), o=BIZ;
  for(var i=0;i<p.length-1;i++){ var k=p[i]; o=o[isNaN(+k)?k:+k]; if(o==null)return null; }
  return {o:o,k:p[p.length-1]};
}
function bizSet(path,val){ var r=bizRef(path); if(r) r.o[isNaN(+r.k)?r.k:+r.k]=val; refresh(); }
function bizGet(path){ var r=bizRef(path); return r?r.o[isNaN(+r.k)?r.k:+r.k]:undefined; }

/* 当前打开的业务面板：动作后原样重绘它 */
function refresh(){
  renderCK(); renderDetail();
  var d=document.getElementById('v6CDrawer');
  if(!d.classList.contains('on'))return;
  if(LAST_BIZ==='@asset')return personalAsset();
  if(LAST_BIZ==='@item')return openLens('item');
  if(LAST_BIZ==='@quest')return openLens('quest');
  if(LAST_BIZ==='@faction')return openLens('faction');
  if(LAST_BIZ)return openBiz(LAST_BIZ);
}
function credit(ledgerIdx,delta){

}

/* ============================================================
   人员：面板内 TAB（名册 / 排班 / 工作优先级 / 工单 / 招聘）
   排班 = RimWorld 式 24 小时格，点击轮换、按住拖动连刷
   ============================================================ */
var SCH_TOKENS=[
  {k:'任意',c:'#4a3620'},
  {k:'工作',c:'#5f7a34'},
  {k:'休息',c:'#3f5a7a'},
  {k:'睡眠',c:'#4a3a6a'},
  {k:'用餐',c:'#7a5330'},
  {k:'娱乐',c:'#6d5a2a'}
];
var SCH_PAINT=false, SCH_TOK=null;
function tokIdx(k){ for(var i=0;i<SCH_TOKENS.length;i++) if(SCH_TOKENS[i].k===k) return i; return 0; }
function tokColor(k){ return SCH_TOKENS[tokIdx(k)].c; }
function tokNext(k){ return SCH_TOKENS[(tokIdx(k)+1)%SCH_TOKENS.length].k; }
function defSched(shift){
  var a=[];
  for(var h=0;h<24;h++){
    var t='睡眠';
    if(h===7) t='任意';
    if(h>=8&&h<12) t='工作';
    if(h===12) t='用餐';
    if(h>=13&&h<18) t='工作';
    if(h>=18&&h<21) t='娱乐';
    if(h>=21) t='休息';
    a.push(t);
  }
  if(shift) for(var j=0;j<shift;j++) a.push(a.shift());
  return a;
}
/* ============================================================
   人员：名册（左概览 + 右详情）/ 排班 / 工作优先级 / 工单 / 招聘
   五个一级 TAB；排班与优先级是全员表，不是某个人的子页
   ============================================================ */
function workRange(s){
  var a=[],b=[];
  s.sched.forEach(function(t,h){ if(t==='工作'){ a.push(h); b.push(h+1); } });
  if(!a.length) return '无工作块';
  var p=function(n){ return ('0'+n).slice(-2)+':00'; };
  return p(Math.min.apply(null,a))+'–'+p(Math.max.apply(null,b));
}
function workHours(s){ var n=0; s.sched.forEach(function(t){ if(t==='工作')n++; }); return n; }
function tabsHtml(){
  var tabs=['名册'];

  }).join('')+'</div>';
}

/* 业务动作分发：所有 data-act 的落点 */
function doAct(s){
  var p=String(s).split(':'), i;
  if(p[0]==='go'){ openBiz(p[1]); return; }

  if(p[0]==='staff'){
    if(p[1]==='sel'||p[1]==='selD'){ BIZ.selStaff=+p[2]; BIZ.tab='名册'; refresh(); return; }
    i=+p[1];
    if(p[2]==='toggle') BIZ.staff[i].on=!BIZ.staff[i].on;
    if(p[2]==='raise'){ BIZ.staff[i].pay=(+BIZ.staff[i].pay)+1; BIZ.staff[i].trust=Math.min(100,BIZ.staff[i].trust+2);
      log('调薪 '+BIZ.staff[i].n+' → '+BIZ.staff[i].pay+'/时'); toast(BIZ.staff[i].n+' 时薪 → '+BIZ.staff[i].pay); }
    if(p[2]==='fire'){ var sf=BIZ.staff[i]; BIZ.staff.splice(i,1); log('解雇 '+sf.n); toast('已解雇 '+sf.n+'，回失业池'); }
  }
  else if(p[0]==='goods'){
    i=+p[1];
    if(p[1]==='add'){
      var ga=GOOD_AVAILABLE[+p[2]];
      if(ga){ BIZ.goods.push({n:ga.n,kind:ga.kind,price:ga.price,stock:ga.stock||0,life:ga.life||'—'}); log('上架 '+ga.n); toast('已上架 '+ga.n); }
    }
    if(p[2]==='delist'){ var gd=BIZ.goods[i]; BIZ.goods.splice(i,1); log('下架 '+gd.n); toast('已下架 '+gd.n); }
    if(p[2]==='restock'){
      var g=BIZ.goods[i], add=(g.kind==='客房'?1:20), cost=Math.round(add*g.price*0.4);
      if(BIZ.ledgers[0].bal<cost){ toast('账本余额不足（需 '+cost+' 金）',true); return; }
      BIZ.ledgers[0].bal-=cost; g.stock+=add; log('补货 '+g.n+' +'+add+' · -'+cost);
      toast('已补 '+g.n+' +'+add+'，扣 '+cost+' 金');
    }
  }
  else if(p[0]==='restockAll'){
    var need=0;
    BIZ.goods.forEach(function(g){ if(g.kind!=='客房'&&g.stock<20) need+=(20-g.stock)*g.price*0.4; });
    need=Math.round(need);
    if(need<=0){ toast('库存都够，无需补货'); return; }
    if(BIZ.ledgers[0].bal<need){ toast('账本余额不足（需 '+need+' 金）',true); return; }
    BIZ.ledgers[0].bal-=need;
    BIZ.goods.forEach(function(g){ if(g.kind!=='客房'&&g.stock<20) g.stock=20; });
    log('一键补货 -'+need); toast('已补货，扣 '+need+' 金');
  }
  else if(p[0]==='purchase'){
    i=+p[1];
    if(BIZ.purchases[i].state==='在途'){
      var pc=BIZ.purchases[i].cost;
      if(BIZ.ledgers[0].bal<pc){ toast('账本余额不足（需 '+pc+' 金）',true); return; }
      BIZ.ledgers[0].bal-=pc;
      BIZ.goods[3].stock+=60;
      BIZ.purchases[i].state='已入库';
      log('到货 '+BIZ.purchases[i].what+' -'+pc); toast('已入库，扣 '+pc+' 金');
    } else toast('这批货已入库');
  }
  else if(p[0]==='book'){
    BIZ.book.state=(BIZ.book.state==='已确认'?'已取消':'已确认');
    log('预订 '+BIZ.book.state); toast(BIZ.book.state==='已取消'?'已取消预订，定金没收':'预订已确认');
  }
  else if(p[0]==='lease'){
    i=+p[1]; var L=BIZ.leases[i];
    if(p[2]==='renew'){ L.months+=6; BIZ.ledgers[1].bal+=L.rent*6; log('续租 '+L.area+' +6 月'); toast('续租 6 个月，租金入商圈账本'); }
    if(p[2]==='evict'){ L.tenant='—'; L.months=0; log('退租 '+L.area); toast(L.area+' 已退租，区域空置'); }
    if(p[2]==='invite'){ L.tenant='新租户'; L.months=6; L.dep.v=L.rent*3; log('招商 '+L.area); toast(L.area+' 已招到租户，签 6 个月'); }
  }
  else if(p[0]==='leaseBuy'){
    if(BIZ.ledgers[1].bal<18000){ toast('商圈账本不足（需 18,000）',true); return; }
    if(lvOf(facVal('市议会'))<2){ toast('需要市议会关系 Lv2（当前 Lv'+lvOf(facVal('市议会'))+'）',true); return; }
    BIZ.ledgers[1].bal-=18000; log('收购地契 -18000'); toast('已收购商业街北侧厂区');
  }
  else if(p[0]==='facility'){
    i=+p[1]; var F=BIZ.facilities[i];
    if(F.tickets>0){ F.tickets--; if(F.tickets===0)F.state='完好'; log('派工 '+F.n); toast('已派维护工到 '+F.n); }
    else toast(F.n+' 状态良好，无需派工');
  }
  else if(p[0]==='campaign'){
    i=+p[1];
    if(p[2]==='stop'){ var C0=BIZ.campaigns[i]; BIZ.campaigns.splice(i,1);
      BIZ.done.unshift({n:C0.n,reach:300,cvr:'5%'}); log('中止 '+C0.n); toast('活动已中止，已花不退'); }
    if(p[2]==='tick'){
      var C=BIZ.campaigns[i], per=Math.round(C.budget/Math.max(1,C.total||7));
      if(BIZ.ledgers[0].bal<per){ toast('账本余额不足，活动停摆',true); return; }
      BIZ.ledgers[0].bal-=per; C.day++;
      if(C.total&&C.day>=C.total){ BIZ.campaigns.splice(i,1); BIZ.done.unshift({n:C.n,reach:1240,cvr:'7%'}); toast('活动结束，已转入已完成'); }
      else toast('推进一天，扣 '+per+' 金');
      log('活动 '+C.n+' 第 '+C.day+' 天 -'+per);
    }
    if(p[2]==='new'){
      var bi=document.querySelector('[data-new="budget"]'), di=document.querySelector('[data-new="days"]');
      var budget=bi?Math.max(0,+bi.value):300, days=di?Math.max(1,+di.value):7;
      var chEl=document.querySelector('[data-newch-on]');
      var ch=chEl?chEl.getAttribute('data-newch-on'):'传单';
      if(BIZ.ledgers[0].bal<budget){ toast('账本余额不足（需 '+budget+'）',true); return; }
      BIZ.ledgers[0].bal-=budget;
      BIZ.campaigns.push({n:'新活动',ch:ch,target:'街区',budget:budget,day:1,total:days,effect:'待观察',state:'进行中'});
      log('投放新活动 -'+budget); toast('已创建并投放，扣 '+budget+' 金');
    }
  }
  else if(p[0]==='permit'){
    i=+p[1]; var PM=BIZ.permits[i], fv=facVal(PM.need.f);
    if(PM.state==='已获得') return;
    if(lvOf(fv)<PM.need.lv){ toast('关系不足：需要 '+PM.need.f+' Lv'+PM.need.lv,true); return; }
    if(PM.cost&&BIZ.ledgers[0].bal<PM.cost){ toast('账本余额不足（需 '+PM.cost+'）',true); return; }
    if(PM.cost)BIZ.ledgers[0].bal-=PM.cost;
    PM.state='已获得';
    log('许可 '+PM.n+(PM.cost?' -'+PM.cost:''));
    toast('已获得「'+PM.n+'」');
  }
  else if(p[0]==='ticket'){
    i=+p[1];
    var free=BIZ.staff.filter(function(x){return x.on;}).sort(function(a,b){return a.tickets-b.tickets;})[0];
    if(!free){ toast('没有在岗员工可认领',true); return; }
    BIZ.tickets[i].owner=free.n; free.tickets++;
    log('派工 '+BIZ.tickets[i].target+' → '+free.n); toast('已派给 '+free.n);
  }
  else if(p[0]==='hire'){
    if(p[1]==='sel'){ BIZ.selHire=+p[2]; refresh(); return; }
    i=+p[1]; var C2=BIZ.hire[i];
    if(BIZ.ledgers[0].bal<200){ toast('账本余额不足（招聘费 200）',true); return; }
    BIZ.ledgers[0].bal-=200;
    BIZ.staff.push({n:C2.n,av:C2.av,role:C2.profs[0][0],pay:C2.ask,trust:20,on:true,hours:0,tickets:0,
      prio:{服务:2,清洁:2,补货:2,维修:2,引导:2},sched:defSched(0)});
    CHAR_DATA[C2.n]={av:C2.av,sub:C2.profs[0][0]+' · 平民',role:'我方',ctrl:false,hp:100,recog:10,mood:60,
      race:C2.race,origin:C2.origin,traits:C2.traits,profs:C2.profs,dims:C2.dims,attrs:C2.attrs,demands:C2.demands,buffs:['新入职']};
    BIZ.hire.splice(i,1); log('招聘 '+C2.n+' -200'); toast('已录用 '+C2.n);
    BIZ.selStaff=BIZ.staff.length-1; BIZ.tab='名册'; BIZ.staffTab='员工';
  }
  else if(p[0]==='sch'){
    if(p[1]==='fill'){ BIZ.staff.forEach(function(x){ x.sched=x.sched.map(function(){ return p[2]; }); }); }
    else if(p[1]==='copy'){ var f0=BIZ.staff[0]?BIZ.staff[0].sched.slice():null;
      if(f0)BIZ.staff.forEach(function(x){ x.sched=f0.slice(); }); }
    else if(p[1]==='reset'){ BIZ.staff.forEach(function(x,ix){ x.sched=defSched(ix%3); }); }
  }
  else if(p[0]==='prio'){
    if(p[1]==='all'){ var v0=+p[2]; BIZ.staff.forEach(function(x){ for(var k in x.prio) x.prio[k]=v0; }); }
    else { i=+p[1]; var j=p[2]; BIZ.staff[i].prio[j]=((BIZ.staff[i].prio[j]||0)+1)%5; }
  }
  else if(p[0]==='xfer3'){
    var v3=BIZ.xferVal||0;
    if(!v3){ toast('拖动滑条选择方向与金额',true); return; }
    var amt3=Math.abs(v3);
    if(v3<0){
      if(BIZ.wallet<amt3){ toast('钱包余额不足',true); return; }
      BIZ.wallet-=amt3; BIZ.ledgers[0].bal+=amt3;
    }else{
      if(BIZ.ledgers[0].bal<amt3){ toast('经营账户余额不足',true); return; }
      BIZ.ledgers[0].bal-=amt3; BIZ.wallet+=amt3;
    }
    BIZ.xferVal=0;
    log('划转 '+amt3+'（'+(v3<0?'注资':'提取')+'）');
    toast('已划转 '+amt3+' 金');
  }
  else if(p[0]==='loan'){
    i=+p[2];
    if(p[1]==='take'){
      var oo=BIZ.loanOffers[i];
      if(oo){ BIZ.ledgers[0].bal+=oo.amt;
        BIZ.loans.push({amt:oo.amt,remain:oo.amt,paid:0,monthly:oo.monthly,rate:oo.rate,term:oo.term,next:'第 15 天'});
        BIZ.loanOffers.splice(i,1); log('借款 '+oo.amt); toast('已放款 '+oo.amt+' 金'); }
    }
    if(p[1]==='repay'){
      var ll=BIZ.loans[i];
      if(ll&&ll.remain>0){
        if(BIZ.ledgers[0].bal<ll.remain){ toast('经营账户余额不足',true); return; }
        BIZ.ledgers[0].bal-=ll.remain;
        ll.paid=(ll.paid||0)+ll.remain; ll.remain=0; ll.closed=true;
        log('还贷 '+ll.amt); toast('已还清');
      }
    }
  }
  else if(p[0]==='xfer2'){
    var x2amtEl=document.querySelector('[data-xfer2="amt"]');
    var x2whyEl=document.querySelector('[data-xfer2="why"]');
    var x2amt=x2amtEl?+x2amtEl.value:0;
    if(!(x2amt>0)){ toast('金额要大于 0',true); return; }
    if((BIZ.selAcc||'wallet')==='wallet'){
      if(BIZ.wallet<x2amt){ toast('钱包余额不足',true); return; }
      BIZ.wallet-=x2amt; BIZ.ledgers[0].bal+=x2amt;
    }else{
      if(BIZ.ledgers[0].bal<x2amt){ toast('经营账户余额不足',true); return; }
      BIZ.ledgers[0].bal-=x2amt; BIZ.wallet+=x2amt;
    }
    log('划转 '+x2amt+'（'+((x2whyEl&&x2whyEl.value)||'资金调拨')+'）');
    toast('已划转 '+x2amt+' 金');
  }
  else if(p[0]==='xfer'){
    var from=document.querySelector('[data-xfer="from"]').value, to=document.querySelector('[data-xfer="to"]').value;
    var amt=+document.querySelector('[data-xfer="amt"]').value;
    var why=document.querySelector('[data-xfer="why"]').value;
    if(from===to){ toast('源与目标相同',true); return; }
    if(!(amt>0)){ toast('金额要大于 0',true); return; }
    var srcFree=(from==='wallet')||BIZ.ledgers[+from].free;
    if(!srcFree){ toast('该账户是薪酬制，只有预算内支出权',true); return; }
    var srcBal=(from==='wallet'?BIZ.wallet:BIZ.ledgers[+from].bal);
    if(srcBal<amt){ toast('余额不足',true); return; }
    if(from==='wallet')BIZ.wallet-=amt; else BIZ.ledgers[+from].bal-=amt;
    if(to==='wallet')BIZ.wallet+=amt; else BIZ.ledgers[+to].bal+=amt;
    log('划转 '+amt+'（'+why+'）'); toast('已划转 '+amt+' 金');
  }
  else if(p[0]==='quest'){
    i=+p[1];
    if(p[2]==='take'){ BIZ.quests[i].state='进行中'; toast('已接取'); }
    if(p[2]==='done'){ BIZ.quests[i].state='已完成'; BIZ.wallet+=120;
      log('完成任务 '+BIZ.quests[i].t+' +120'); toast('任务完成，奖励 120 金'); }
  }
  else if(p[0]==='fac'){
    i=+p[1]; var fcost=200+lvOf(FACTIONS[i].val)*100;
    if(BIZ.wallet<fcost){ toast('钱包不够（需 '+fcost+'）',true); return; }
    BIZ.wallet-=fcost; FACTIONS[i].val=Math.min(100,FACTIONS[i].val+6);
    log('向'+FACTIONS[i].n+'募捐 '+fcost+' · 关系 +6');
    toast(FACTIONS[i].n+' 关系 '+FACTIONS[i].val+'（Lv'+lvOf(FACTIONS[i].val)+'）');
  }
  else if(p[0]==='item'){
    i=+p[1]; var it=BIZ.items[i];
    if(p[2]==='use'){ it.qty--; toast('已使用 '+it.n); if(it.qty<=0){ BIZ.items.splice(i,1); } }
    if(p[2]==='drop'){ BIZ.items.splice(i,1); toast('已丢弃 '+it.n); }
  }
  refresh();
}

/* 营业时段：6 天 × 24 个 1 小时格；亮格 = 营业 */
function defSlots(from,to){ var a=[]; for(var h=0;h<24;h++) a.push((h>=from&&h<to)?1:0); return a; }
var SCHEDULE=[
  {d:'周一',slots:defSlots(8,22)},
  {d:'周二',slots:defSlots(8,22)},
  {d:'周三',slots:defSlots(8,22)},
  {d:'周四',slots:defSlots(8,22)},
  {d:'周五',slots:defSlots(8,22)},
  {d:'周六',slots:defSlots(10,22)}
];
function schedTotal(){
  var n=0;
  SCHEDULE.forEach(function(r){ r.slots.forEach(function(v){ if(v)n+=60; }); });
  return n;
}
function slotLabel(j){
  var a=('0'+j).slice(-2), b=('0'+(j+1)).slice(-2);
  return a+':00–'+b+':00';
}
function hoursBody(){
  var head='<tr><th></th>';
  for(var j=0;j<24;j++) head+='<th>'+(j%2===0?('0'+j).slice(-2):'')+'</th>';
  head+='</tr>';
  var rows=SCHEDULE.map(function(r,i){
    var cells='';
    for(var j=0;j<24;j++){
      cells+='<td><span class="v6-slot'+(r.slots[j]?' on':'')+'" data-slot="'+i+':'+j+'" title="'+r.d+' '+slotLabel(j)+'"></span></td>';
    }
    return '<tr><th>'+r.d+'</th>'+cells+'</tr>';
  }).join('');
  var h='<div class="v6-group"><div class="v6-gt">每周营业时段 · 共 '+(schedTotal()/60).toFixed(1)+' 小时/周</div>'+
      '<table class="v6-schedmtx">'+head+rows+'</table></div>';
  return h;
}
function bizHours(){ return openCDrawer('🕘 '+bizTitle('营业时段'),hoursBody(),true); }

      '<span class="v6-opt" data-act="sch:copy">首行套用全部</span>'+

function applyPreset(k){
  function setRange(i,from,to,on){
    for(var j=0;j<24;j++){ SCHEDULE[i].slots[j]=(on&&j>=from&&j<to)?1:0; }
  }
  if(k==='daily'){ SCHEDULE.forEach(function(_,i){ setRange(i,8,22,true); }); }
  else if(k==='workweek'){ SCHEDULE.forEach(function(_,i){ setRange(i,i<5?10:12,i<5?20:24,true); }); }
  else if(k==='closed'){ SCHEDULE.forEach(function(_,i){ setRange(i,0,0,false); }); }
  else if(k==='reset'){ SCHEDULE.forEach(function(_,i){ setRange(i,i<5?8:10,22,true); }); }
}

/* ============================================================
   战棋（遭遇战）
   ============================================================ */
function startEncounter(){
  EXP='combat'; CUR_UNIT=0; CUR_ROUND=1; ARMED=null;
  document.getElementById('v6Scr').dataset.combat='1';
  TEAM.forEach(function(n){ CHAR_DATA[n].apMax=6; CHAR_DATA[n].ap=6; });
  FOES.forEach(function(n){ FOE_DATA[n].apMax=6; FOE_DATA[n].ap=6; });
  clearSel(); renderAll();
  toast('⚔ 遭遇战开始 —— 第 1 回合',true);
}
function endEncounter(){
  EXP='free'; delete document.getElementById('v6Scr').dataset.combat;
  FOREST_KILLS=Math.min(3,FOREST_KILLS+FOES.length);
  CUR_UNIT=0; ARMED=null; renderAll();
  toast('🏆 遭遇战胜利！探索目标 '+FOREST_KILLS+'/3');
}
function advanceTurn(){
  var order=turnOrder();
  do{ CUR_UNIT=(CUR_UNIT+1)%order.length; if(CUR_UNIT===0)CUR_ROUND++; }while(order[CUR_UNIT].data.hp<=0);
  order[CUR_UNIT].data.ap=order[CUR_UNIT].data.apMax;
}
function endTurn(){
  ARMED=null; advanceTurn();
  var u=turnOrder()[CUR_UNIT];
  if(u.foe){ toast('—— 敌方行动 ——',true); setTimeout(enemyAct,450); }
  renderAll();
}
function enemyAct(){
  var u=turnOrder()[CUR_UNIT];
  if(u.data.hp>0){
    var alive=TEAM.filter(function(n){return CHAR_DATA[n].hp>0;});
    var tn=alive[Math.floor(Math.random()*alive.length)];
    CHAR_DATA[tn].hp=Math.max(1,CHAR_DATA[tn].hp-7);
    toast('🗡 '+u.nm+' 攻击 '+tn+' -7',true);
  }
  advanceTurn();
  if(turnOrder()[CUR_UNIT].foe){ setTimeout(enemyAct,450); }
  renderAll();
}
function useSkill(i){
  var order=turnOrder(), u=order[CUR_UNIT], c=u.data, s=SKILLS[i];
  if(u.foe||c.ap<s[2])return;
  if(i===0||i===1||i===5){ ARMED=(ARMED===i?null:i); toast(ARMED!==null?'选择目标（点击敌人） · Esc 取消':'已取消'); }
  else{ c.ap-=s[2]; toast({2:'🧪 使用道具',3:'🏃 移动（占位）',4:'🛡 防御姿态'}[i]); }
  renderB();
}
function attackFoe(f){
  var order=turnOrder(), u=order[CUR_UNIT], c=u.data, s=SKILLS[ARMED];
  var d=FOE_DATA[f]; if(d.hp<=0)return;
  var dmg={0:20,1:35,5:25}[ARMED]||15;
  c.ap-=s[2]; d.hp=Math.max(0,d.hp-dmg);
  ARMED=null;
  if(FOES.every(function(x){return FOE_DATA[x].hp<=0;})){
    setTimeout(endEncounter,900);
  }
  renderWorld(); renderB(); renderCK();
  dmgFloat(f,dmg); /* 世界重渲染之后再叠加飘字，避免被 innerHTML 清除 */
}
function dmgFloat(f,d){
  var vp=document.getElementById('v6Vp'), mk=vp.querySelector('[data-foe="'+f+'"]');
  if(!mk)return;
  var fl=document.createElement('div'); fl.className='v6-dmg'; fl.textContent='-'+d;
  fl.style.left=mk.style.left; fl.style.top=mk.style.top;
  vp.appendChild(fl); setTimeout(function(){ fl.remove(); },1000);
}
/* 区域定位（世界点击区域时的高亮指引）：状态存全局，随 renderWorld 重绘，避免被清除 */
var LAST_LOCATE=null;
function locateRegion(id){
  LAST_LOCATE=id;
  renderAll();
}
function drawLocate(){
  if(!LAST_LOCATE||MAP!=='main')return;
  var loc=REGION_LOC[LAST_LOCATE];
  if(!loc)return;
  var vp=document.getElementById('v6Vp');
  var box=document.createElement('div'); box.className='v6-locator';
  box.style.cssText='left:'+loc.left+';top:'+loc.top+';width:'+loc.w+'px;height:'+loc.h+'px;';
  box.innerHTML='<span class="nm">📍 '+LAST_LOCATE+'</span>';
  vp.appendChild(box);
}
</script>

<script>

  if(d.mode){ switchMode(d.mode); return; }
  if(d.travel){ travel(d.travel); return; }
  if(d.openmap!==undefined){ openMapModal(); return; }

  /* 系统条 */
  if(d.speed!==undefined){ if(MODE==='manage'){ SPEED=d.speed==='p'?0:parseInt(d.speed); renderMap(); renderB(); } return; }
  if(d.atab){ BIZ.assetTab=d.atab; personalAsset(); return; }
  if(d.xdir){ BIZ.xdir=d.xdir; BIZ.xamt=null; personalAsset(); return; }
  if(d.acc){ BIZ.selAcc=d.acc; personalAsset(); return; }
  if(d.pmode){ BIZ.prodMode=d.pmode; BIZ.goodsPage=0; openBiz('货物'); return; }
  if(d.gpage!==undefined){ BIZ.goodsPage=Math.max(0,+d.gpage); openBiz('货物'); return; }
  if(d.ipage!==undefined){ BIZ.invPage=Math.max(0,+d.ipage); openBiz('货物'); return; }
  if(d.gtab){ BIZ.goodsTab=d.gtab; openBiz('货物'); return; }
  if(d.sctab){ BIZ.scTab=d.sctab; renderStaffCard(); return; }
  if(d.staffcard!==undefined){
    renderStaffCard();
    var scOn=document.getElementById('v6StaffCard').classList.toggle('on');
    var scBtn=document.querySelector('.v6-stafftoggle');
    if(scBtn) scBtn.textContent=scOn?'收起':'展开';
    return;
  }
  if(d.closestaffcard!==undefined){ document.getElementById('v6StaffCard').classList.remove('on'); return; }
  if(d.wtab){ BIZ.workTab=d.wtab; openBiz('工作'); return; }
  if(d.ctab){ BIZ.custTab=d.ctab; BIZ.staffTab='顾客'; openBiz('人员'); return; }
  if(d.ptab){ BIZ.staffTab=d.ptab; openBiz('人员'); return; }
  if(d.stab){ BIZ.staffSub=d.stab; openBiz('人员'); return; }
  if(d.tab){ BIZ.tab=d.tab; openBiz('人员'); return; }
  if(d.act){ doAct(d.act); return; }
  if(d.newch){ var chips=document.querySelectorAll('[data-newch]');
    for(var ci=0;ci<chips.length;ci++){ chips[ci].classList.remove('on'); chips[ci].removeAttribute('data-newch-on'); }
    t.classList.add('on'); t.setAttribute('data-newch-on',d.newch); return; }
  if(d.ficon){ var fopts=t.parentNode.querySelectorAll('[data-ficon]');
    for(var fi=0;fi<fopts.length;fi++) fopts[fi].classList.remove('on');
    t.classList.add('on'); return; }
  if(d.fopt){ var sopts=t.parentNode.querySelectorAll('[data-fopt]');
    for(var so=0;so<sopts.length;so++) sopts[so].classList.remove('on');
    t.classList.add('on'); return; }
  if(d.rtab){ BIZ.regionTab=d.rtab; bizRegion(); return; }
  if(d.statgrp){ STATGRP=d.statgrp; BIZ.regionTab='口碑'; bizRegion(); return; }
  if(d.slot){ var sp=d.slot.split(':'); var si=+sp[0],sj=+sp[1]; SCHEDULE[si].slots[sj]=SCHEDULE[si].slots[sj]?0:1; BIZ.workTab='营业时间'; openBiz('工作'); return; }
  if(d.schedpreset){ applyPreset(d.schedpreset); BIZ.workTab='营业时间'; openBiz('工作'); return; }
  if(d.cal!==undefined){ toast('📅 第 12 天 · 春（日历占位）'); return; }
  if(d.sysmenu!==undefined){ toggleSysMenu(); return; }
  if(d.sys){ var sm=document.getElementById('v6SysMenu'); sm.classList.remove('on'); escPop('sysmenu');
    if(d.sys==='save'){ toast('💾 已保存'); closeModal(); }
    else if(d.sys==='quit'){ toast('返回主菜单（占位）',true); closeModal(); }
    else if(d.sys==='help'){ toast('帮助（占位）'); closeModal(); }
    else openSysModal(d.sys); return; }

  /* 右列：环境组弹窗（视角/渲染层/剖切框，独立开合不自动收起） */
  if(d.envpop){ toggleEnvPop(d.envpop); return; }
  if(d.mbtn==='locate'){ toast('🎯 镜头已回到当前位置'); return; }
  if(d.lay!==undefined){ var lays=t.parentNode.querySelectorAll('[data-lay]');
    for(var li=0;li<lays.length;li++)lays[li].classList.remove('on');
    t.classList.add('on'); toast('🗜 渲染层：'+d.lay); return; }
  if(d.cut!==undefined){ var cutOn=t.classList.toggle('on'); t.textContent=cutOn?'显示':'隐藏'; return; }
  if(d.jpop!==undefined){ toggleJPop(); return; }

  /* 统一选中：区域/子区域/角色 → 右槽实体卡 */
  if(d.selArea){ closeCDrawer(); setSel({type:'area',id:d.selArea}); if(MAP==='main')locateRegion(d.selArea); return; }
  if(d.selSub){ setSel({type:'sub',id:d.selSub}); return; }
  if(d.selChar){ setSel({type:'char',id:d.selChar}); return; }

  if(d.open!==undefined){ STORE.open=d.open==='1'; AREA_DATA['我的酒店'].open=STORE.open;
    toast(STORE.open?'☀ 开始营业':'🌙 已打烊'); renderAll();

    return; }
  if(d.encounter!==undefined){ startEncounter(); return; }
  if(d.talk){ openDlg(d.talk); return; }

  /* 玩家域 / 功能路由 */
  if(d.swapdom!==undefined){
    if(MODE==='build'){ toast('建造中不可切换主域',true); return; }
    MAIN_DOMAIN=(MAIN_DOMAIN==='district')?'shop':'district';
    closeCDrawer(); renderCK(); renderB(); return; }
  if(d.raildr){ openLens(d.raildr); return; }
  if(d.fn){ openFn(d.fn); return; }
  if(d.areaForm){ openAreaForm(d.areaForm); return; }

  /* 建造：工具（一级栏点组 = 激活该组最近所用工具；二级栏/数字键选具体工具，无弹框） */
  if(d.tgroup){ var tg=TOOL_GROUPS.filter(function(x){return x.g===d.tgroup;})[0]; if(!tg)return;
    var lt=tg.tools.filter(function(x){return x.t===LAST_IN_GROUP[tg.g]&&!x.soon;})[0]||tg.tools.filter(function(x){return !x.soon;})[0];
    TOOL=lt.t; LIB_COLLAPSED=false; LIB_Q=''; setPlaceSilent(); renderAll(); return; }
  if(d.tool){ var tc=null; flatTools().forEach(function(x){ if(x.t===d.tool)tc=x; });
    if(tc&&tc.soon){ toast('「'+d.tool+'」敬请期待',true); return; }
    TOOL=d.tool; var cg=toolGroupOf(TOOL); if(cg)LAST_IN_GROUP[cg]=TOOL;
    LIB_COLLAPSED=false; LIB_Q=''; setPlaceSilent(); renderAll(); return; }
  /* 建造：库行（内容完全跟随当前工具；拿起方块不抢几何工具） */
  if(d.collapseLib!==undefined){ LIB_COLLAPSED=true; renderLib(); return; }
  if(d.expandLib!==undefined){ LIB_COLLAPSED=false; renderLib(); return; }
  if(d.mat){ var p=d.mat.split(':'), mtype=p[0]; MATERIAL={kind:mtype,id:parseInt(p[1]),nm:p[2]};

  }
});

  if(PLACE==='IDLE'){ PLACE_P1={x:x,y:y}; PLACE_P2={x:x+18,y:y+16}; setPlace('PLACING'); toast('第一点已确认 · 再点击确定第二点'); }
  else if(PLACE==='PLACING'){ PLACE_P2={x:x,y:y}; setPlace('EDITING'); }
}

/* ============================================================
   键盘层
   ============================================================ */
window.addEventListener('keydown',function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='Escape'){ onEsc(); return; }
  if(e.key==='Tab'){ e.preventDefault();
    if(MAP==='main')switchMode(MODE==='build'?'manage':'build');
    else toast('探索中 —— 按 M 打开地图选择目的地'); return; }
  if(e.key==='b'||e.key==='B'){ if(MAP==='main')switchMode(MODE==='build'?'manage':'build'); return; }
  if(e.key==='m'||e.key==='M'){ openMapModal(); return; }
  if(e.key===' '){ e.preventDefault();
    if(EXP==='combat')endTurn();
    else if(MODE==='manage'){ SPEED=SPEED===0?1:0; renderMap(); toast(SPEED?'▶ 时间继续':'⏸ 时间暂停'); }
    return; }
  if(MODE==='build'){
    if(e.ctrlKey&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); doUndo(); return; }
    if(e.ctrlKey&&(e.key==='y'||e.key==='Y')){ e.preventDefault(); doRedo(); return; }
    if(e.key==='Enter'){ confirmPlace(); return; }
    if(e.key==='Delete'&&SEL&&SEL.type==='voxel'){ histPush('删除选区（1,284 体素）'); clearSel(); toast('🗑 已删除选区体素'); return; }
    var n=parseInt(e.key);
    if(!isNaN(n)&&n>=1&&n<=9){
      var cg=toolGroupOf(TOOL); if(!cg)return;
      var grp=TOOL_GROUPS.filter(function(x){return x.g===cg;})[0], tt=grp.tools[n-1];
      if(tt){ if(tt.soon){ toast('「'+tt.t+'」敬请期待',true); return; }
        TOOL=tt.t; LAST_IN_GROUP[cg]=tt.t; LIB_COLLAPSED=false; LIB_Q=''; setPlaceSilent(); renderAll(); }
      return;
    }
  }
});

/* ============================================================
   初始化
   ============================================================ */
function scCard(av,nm,sub,act){
  return '<div class="v6-sccard" data-fn="人员"><div class="av">'+av+'</div><div class="nm">'+nm+'</div>'+
    (sub?'<div class="sub">'+sub+'</div>':'')+(act?'<div class="act">'+act+'</div>':'')+'</div>';
}
function renderStaffCard(){
  var el=document.getElementById('v6StaffCard'); if(!el)return;
  if(!BIZ.scTab) BIZ.scTab='员工';
  var tabs=['员工','顾客'];
  var th='<div class="v6-tabs">'+tabs.map(function(t){
    return '<span class="v6-tab'+(BIZ.scTab===t?' on':'')+'" data-sctab="'+t+'">'+t+'</span>';
  }).join('')+'</div>';
  var grid='';
  if(BIZ.scTab==='员工'){
    grid=BIZ.staff.filter(function(s){ return s.on; }).map(function(s){
      var t0=BIZ.tickets.filter(function(t){ return t.owner===s.n; })[0];
      return scCard(s.av,s.n,s.role,t0?('正在 '+t0.target):'在岗待命');
    }).join('')||'<div class="v6-none">当前没有在岗员工</div>';
  } else {
    grid=[['🧑','艾琳','店内','浏览中 · 2 人'],['🧔','汤姆','店内','排队第 2 位'],['👩','莉亚','店内','结账中 · 3 人'],
          ['🧓','维克','住店','201'],['👩','米拉','住店','305']].map(function(c){
      return scCard(c[0],c[1],c[2],c[3]);
    }).join('');
  }
  el.innerHTML=th+'<div class="v6-scgrid">'+grid+'</div>';
}
function renderAll(){ renderCK(); renderSide(); renderMap(); renderJrnl(); renderB(); renderLib(); renderCfg(); renderDetail(); renderWorld(); renderStaffCard(); }
/* 库行搜索：input 事件只局部刷新网格（不整行重绘，避免输入框丢焦点） */
document.getElementById('v6Lib').addEventListener('input',function(e){
  if(e.target&&e.target.dataset&&e.target.dataset.libsearch!==undefined){
    LIB_Q=e.target.value; var g=document.getElementById('v6LibGrid'), type=TOOL_LIB[TOOL];
    if(g&&type)g.innerHTML=libCells(type,libFiltered(type)); } });
function paintCell(el,i,h){ if(!SCH_TOK)return;
  BIZ.staff[i].sched[h]=SCH_TOK;
  el.style.background=tokColor(SCH_TOK);
  el.setAttribute('data-tt', BIZ.staff[i].n+' · '+h+':00 '+SCH_TOK); }
document.getElementById('v6Scr').addEventListener('mousedown',function(e){
  var t=e.target; if(!t||!t.dataset||t.dataset.sch===undefined)return;
  var p=t.dataset.sch.split(':'); SCH_TOK=tokNext(BIZ.staff[+p[0]].sched[+p[1]]);
  SCH_PAINT=true; paintCell(t,+p[0],+p[1]); e.preventDefault();
});
document.getElementById('v6Scr').addEventListener('mouseover',function(e){
  if(!SCH_PAINT)return;
  var t=e.target; if(!t||!t.dataset||t.dataset.sch===undefined)return;
  var p=t.dataset.sch.split(':'); paintCell(t,+p[0],+p[1]);
});
document.getElementById('v6Scr').addEventListener('mouseup',function(){ SCH_PAINT=false; SCH_TOK=null; });
document.getElementById('v6Scr').addEventListener('change',function(e){
  var t=e.target; if(!t||!t.dataset)return;
  if(t.dataset.gq!==undefined){ BIZ.goodsQ=t.value; BIZ.goodsPage=0; openBiz('货物'); return; }
  if(t.dataset.gkind){ BIZ.goodsKind=t.value; BIZ.goodsPage=0; openBiz('货物'); return; }
  if(t.dataset.invq!==undefined){ BIZ.invQ=t.value; BIZ.invPage=0; openBiz('货物'); return; }
  if(t.dataset.invkind){ BIZ.invType=t.value; BIZ.invPage=0; openBiz('货物'); return; }
});
document.getElementById('v6Scr').addEventListener('input',function(e){
  var t=e.target; if(!t||!t.dataset)return;
  if(t.dataset.schedfield){ return; }
  if(t.dataset.invkind){ BIZ.invType=t.value; openBiz('货物'); return; }
  if(t.dataset.xamt){
    var xv=+t.value; BIZ.xferVal=xv;
    var lb=document.getElementById('v6XferLbl');
    if(lb) lb.textContent=xv<0?('钱包 → 经营账户  '+(-xv)+' 金'):(xv>0?('经营账户 → 钱包  '+xv+' 金'):'拖动滑条选择方向与金额');
    return;
  }
  if(t.dataset.invth){ var gi=+t.dataset.invth; if(BIZ.goods[gi]) BIZ.goods[gi].th=+t.value||0; return; }
  if(t.dataset.biz){ var r=bizRef(t.dataset.biz); if(r){ var v=t.value, num=/^-?\d+(\.\d+)?$/.test(v);
      r.o[isNaN(+r.k)?r.k:+r.k]=num?+v:v; } }
});
syncModeAttr();
renderAll();
</script>
